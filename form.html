<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="Product Review Form, web page week 5 for Jacob Ethington in the WDD 131 ">
    <meta name="author" content="Jacob Dwayne Ethington">

    <link rel="shortcut icon" href="images/temple.ico" type="image/x-icon">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form action="review.html" method="get" class="wf1">

            <div class="product">

                <label for="product">Product Name*
                    <select name="product" id="product">
                        <option value="" selected disabled>Select a Product... &#9662;</option>
                        <option value="product-name">Select a Product..1</option>

                    </select>
                </label>
            </div>

            <div class="star">
                <label>Overall Rating</label>
                <div>
                    <label for="one">&star;<input type="radio" name="rating" value="one" id="one" required></label>
                    <label for="two">&star;&star;<input type="radio" name="rating" value="two" id="two"
                            required></label>
                    <label for="three">&star;&star;&star;<input type="radio" name="rating" value="three" id="three"
                            required></label>
                    <label for="four">&star;&star;&star;&star;<input type="radio" name="rating" value="four" id="four"
                            required></label>
                    <label for="five">&star;&star;&star;&star;&star;<input type="radio" name="rating" value="five"
                            id="five" required></label>
                </div>
            </div>

            <div class="date">
                <label>Date of Installation <input type="date" id="date" name="install" value="" required></label>
            </div>

            <div>Which features do you find useful in the product?<br>(Check all that apply)
                <label><input type="checkbox" id="design" name="design" value="yes">Design</label>
                <label><input type="checkbox" id="durability" name="durability" value="yes">Durability</label>
                <label><input type="checkbox" id="easy" name="easy" value="yes">Ease of Use</label>
                <label><input type="checkbox" id="performance" name="performance" value="yes">Performance</label>
            </div>

            <div class="review">
                <label>Written Review <span>(optional)</span></label>
                <!-- Check cols -->
                <textarea name="review" id="review">Write a review</textarea>
            </div>

            <div>
                <label>Your Name <span>(optional)</span><input type="text" id="user" name="user"
                        value="Your Name"></label>
            </div>

            <input type="submit" value="Post My Review">

        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentYear"></span> 🐄 Jacob Dwayne Ethington 🐄 Arizona</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
